name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and execute example
        run: |
          python orx.py build examples/hello -o hello.orx
          python orx.py check hello.orx
          python orx.py inspect hello.orx
          python orx.py run hello.orx
